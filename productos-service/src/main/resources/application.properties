spring.application.name=productos-service
server.port=8082
spring.datasource.url=${PRODUCTOS_DB_URL}
spring.datasource.username=${PRODUCTOS_DB_USER}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
tienda.jwt.secret=${TIENDA_JWT_SECRET}
tienda.jwt.issuer=tienda-usuarios
tienda.jwt.audience=tienda-api
