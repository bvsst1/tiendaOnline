spring.application.name=usuarios-service
server.port=8081
spring.datasource.url=${USUARIOS_DB_URL}
spring.datasource.username=${USUARIOS_DB_USER}
spring.datasource.password=${USUARIOS_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
tienda.jwt.secret=${TIENDA_JWT_SECRET}
tienda.jwt.issuer=tienda-usuarios
tienda.jwt.audience=tienda-api
